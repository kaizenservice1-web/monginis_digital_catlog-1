<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select Your Profile — Monginis</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-page="employee-select">
  <main class="main">
    <section class="section">
      <div class="panel">
        <div class="admin-bar">
          <div><span class="detail-kicker">Employee Portal</span><h1 class="h1">Select Your Profile</h1><p class="sub">Choose the profile whose tasks and shifts you are working on.</p></div>
          <button class="btn danger btn-sm" id="employeeLogoutBtn" type="button">Sign Out</button>
        </div>
        <div class="grid three" id="employeeProfiles" style="margin-top:24px;"></div>
        <div class="tiny muted" id="employeeSelectMsg" style="margin-top:16px;"></div>
      </div>
    </section>
  </main>
  <script src="../script.js"></script>
</body>
</html>
