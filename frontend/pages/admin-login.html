<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Secure Admin Login — Monginis (The Celebration Bakers)" />
  <title>Admin Portal Login — Monginis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-page="admin-login">
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="auth-wrap">
    <div class="panel auth-card">
      <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 24px; text-align: center;">
        <img class="footer-logo" src="../assets/logo.png" alt="Monginis logo" loading="eager" onerror="this.onerror=null;this.src='../assets/logo-placeholder.svg'" />
        <div style="text-align: left;">
          <div class="footer-name">Admin Portal</div>
          <div class="footer-tag">Monginis — The Celebration Bakers</div>
        </div>
      </div>

      <form class="form" id="adminLoginForm" autocomplete="on">
        <div class="field">
          <label for="adminEmail">Owner Email Address</label>
          <input class="input" id="adminEmail" type="email" autocomplete="username" placeholder="owner@monginis.com" required />
        </div>
        <div class="field">
          <label for="adminPassword">Password</label>
          <input class="input" id="adminPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button class="btn primary" id="adminLoginBtn" type="submit" style="margin-top: 6px;">
          <i class="fa-solid fa-lock"></i> Sign In to Dashboard
        </button>
        <div class="tiny muted" id="adminMsg" style="text-align: center; margin-top: 4px;">
          Authorized owner access only.
        </div>
        <a class="btn ghost btn-sm" href="../index.html" style="margin-top: 10px;">
          <i class="fa-solid fa-arrow-left"></i> Return to Main Website
        </a>
      </form>

      <div class="footer-meta" style="margin-top: 24px; justify-content: center;">
        <div class="tiny muted">© <span class="year-now"></span> Sarang Chavan. All rights reserved.</div>
      </div>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
